# RobinPi (Rotkehlchen) — Mono fullrange streamer
# Pi Zero 2W · Louder Hat Plus 1X (TAS5825M @ 0x4c) · PBTL bridge mono
# Driver: Mark Audio Pluvia 11 (single fullrange), PR-loaded (Dayton DS175-PR).
# Zipp2/BeatBird recipe, but mono/PBTL instead of stereo — see the vault
# (projekte/RobinPi) for the "why".

identity:
  hostname: robinpi
  friendly_name: "RobinPi"
  speaker_id: robin_pi

platform: pi-zero-2w

soundcard:
  driver: louder-hat-plus-1x
  primary_i2c: 0x4c
  pbtl: true              # bridge mono — ALSO close SJ5+SJ6 on the board
  sub_enabled: false
  # 0 dB statt der üblichen −3 dB "safety margin at boot". Zwei Gründe, und der
  # zweite ist der wichtigere: (1) RobinPi hat EINEN Treiber mittlerer
  # Empfindlichkeit an einem Mono-Amp und braucht den Pegel; (2) der Chip läuft
  # ohnehin seit dem Bring-up auf 0 dB — das Init-Skript hat den Wert wegen der
  # Control-Namen im PBTL-Modus nie gesetzt (gefixt 17.09.2026). Der Eintrag
  # −3 dB beschrieb also einen Zustand, den es nie gab. Hier steht jetzt, was
  # wirklich anliegt, statt was gemeint war.
  analog_gain_db: 0

audio:
  camilladsp_config: robinpi     # config/camilladsp/robinpi.yml — Voicing v3
                                 # (measured 2026-09-06, revoiced 2026-09-17)
  sample_rate: 48000
  format: S32_LE
  volume:
    min_db: -60
    # ⚠️ −2 dB statt der üblichen −10 dB, und das ist eine RobinPi-Entscheidung,
    # keine Abweichung aus Versehen: RobinPi ist der einzige Speaker im Stall
    # mit EINEM Treiber (88,1 dB/2,83 V) im PBTL-Mono an einem Chip, der laut
    # Register bereits auf Unity steht (DIG_VOL 0x30 = 0 dB, Analog Gain 0 dB,
    # am 17.09.2026 ausgelesen). Die fehlenden 8 dB lagen damit ALLEIN im
    # Fader. Gegengerechnet: −2 dB + headroom −4 dB ⇒ −6 dBFS am Amp ⇒ rund
    # 97 dB SPL @1 m Spitze, Treiberhub im Worst Case 3,8 von 4,0 mm linear.
    # Weiter hoch geht nur zusammen mit weniger EQ-Boost — die beiden teilen
    # sich denselben Headroom.
    max_db: -2
    curve_gamma: 1.0
  loudness:
    # AUS seit 15.09.2026 — die Loudness liegt jetzt als nativer
    # CamillaDSP-Loudness-Filter in config/camilladsp/robinpi.yml und hängt
    # dort direkt am Main-Fader. Die Bridge regelt nur noch die Lautstärke.
    # Warum: die Python-Loudness patchte dieselben Biquads wie der Web-EQ-
    # Editor (Lock nötig, blieb er offen stand die Kompensation still), sie
    # rechnete mit der UI-Prozentzahl statt mit dB, und ihr base_gain war in
    # der DSP-Datei unsichtbar. Vorbild: KestrelPi.
    # ⚠️ Wieder auf true nur zusammen mit dem Rückbau der DSP-Config —
    # sonst patchen Bridge UND Loudness-Filter gleichzeitig in den Bass.
    # ⚠️ Stand bis 17.09.2026 im Repo noch auf true und existierte nur als
    # lokaler Patch auf dem Gerät — ein argumentloses beatbird-update hätte
    # die Doppel-Anhebung zurückgebracht.
    enabled: false
    filters: []

display:
  # RobinPi uses the Waveshare AMOLED 1.75 (CO5300) — different board than
  # Beat/Zipp (1.43/SH8601) but same 466×466 UI. Firmware: flash env `robinpi`
  # (BOARD_AMOLED_175). Set type: none if no AMOLED is attached during bring-up.
  type: amoled
  variant: waveshare-1.75
  serial_device: auto
  spectrum_bands: 0      # FFT capture conflicts with CamillaDSP on ALSA Loopback
  # ── Palette: petrol enclosure, bronze/champagne cone ──
  # Bronze instead of the champagne default. The strip flanks the cone, so its
  # light reads as an extension of it, and warm on petrol is near-complementary
  # — a petrol strip on a petrol enclosure would disappear into the paint. That
  # is the opposite call to zipp-mini-2 (petrol accent) and it is not a
  # contradiction: there, gold was foreign to the object; here it is bolted to
  # the baffle.
  # glow (FFA548) and dim (38240F) are DERIVED by the firmware from this one
  # value, so they stay unset — one source of truth. Text and alert keep the
  # firmware defaults; rust alert still reads apart from bronze when it blinks.
  accent_color: "E0913F"
  # ── Brustfleck: SK6812-RGBW status strip on the DISPLAY ESP32 (GPIO18) ──
  # Not on the Pi: display and strip both sit on the front (one harness instead
  # of a lead across the pressure chamber), and the ESP32 already parses the
  # ST:/SYS:/PAL: lines, so the status logic is free there.
  # Pushed to the firmware as a LED: line on every (re)connect — the firmware
  # ships identical for all speakers and drives no GPIO until it arrives.
  status_led:
    enabled: true
    pin: 18                # ESP32-S3 GPIO on the 8-pin 2.54 header (17/21 also free)
    count: 46
    chip: sk6812-rgbw      # GRBW byte order, verified on hardware 03.09.2026
    brightness: 40         # Betriebsmittel, not taste: ~1.3 A at 120 vs ~2.8 A
                           # uncapped — must stay under the 5 V converter budget
    # ── Farbkalibrierung des Streifens (gemessen 06.09.2026) ──
    # white_point = das RGB-Tripel, das auf DIESEM Streifen neutralweiss ergibt.
    # Ein 8-Bit-Wert ist ein Ansteuerwert, keine Helligkeit: die gruene Diode
    # gibt bei gleichem Digit 2-3x so viel wahrgenommenes Licht ab wie die rote.
    # Ohne diesen Abgleich driftet jede warme Farbe nach Gruen/Weiss - genau die
    # Ursache hinter "arktisblau", "gelbgruen" und "Gruenstich auf Gelb".
    # Gegen Neutralweiss eingestellt (a=FFFFFF, wmix=0, bri=100) und bestaetigt.
    white_point: "FF8C64"
    # Anteil des unbunten Teils einer Farbe, der auf die WARMWEISSE W-Diode geht.
    # 0 = nie (blasse Toene werden kalt, weil drei schmalbandige Dioden kein
    # neutrales Weiss mischen), 100 = ganz (warme Toene werden zu Warmweiss,
    # weil die Phosphordiode pro Digit viel heller ist). Beides gemessen.
    # Grundperiode eines Twinkle-Zyklus (jedes Pixel wuerfelt zwischen 1x und
    # 2x davon). Duty und Periode MULTIPLIZIEREN sich: der Exponent bestimmt,
    # wie VIELE Pixel gleichzeitig leuchten, Duty x Periode wie LANG ein
    # einzelnes Glimmen dauert. 30 s => ~3-8 s Auf- und Abschwellen.
    twinkle_period_s: 30
    white_mix: 45
    mapping: bloom         # zwei sichtbare Balken links/rechts vom Treiber.
                           # Jeder Balken blüht aus SEINER EIGENEN Mitte auf
                           # (LED 12 von 23, dann 11+13, 10+14 …) — nicht aus
                           # der Kettenmitte wie bei `mirror`. Der Unterschied
                           # ist sichtbar, nicht kosmetisch.
    # ── Tageszeit: Ambiente nur abends, Rueckmeldung immer ──
    # Im Leerlauf ist der Streifen Ambiente -> tagsueber aus, nachts schlafend
    # mit dem Display. Waehrend der Wiedergabe ist er Rueckmeldung -> bleibt
    # sichtbar, nachts nur leiser. Ein Wert pro Phase koennte das nicht.
    # 0 = aus, ohne den Pin freizugeben: die Firmware rendert nur auf Null und
    # ist sofort wieder da, ohne neuen LED:-Handshake.
    auto_dim:
      enabled: true
      idle_day: 0
      idle_evening: 40
      idle_night: 0
      active_day: 40
      active_evening: 40
      active_night: 12
    chain_join: inner      # Jumper zwischen den Balken sitzt hinter dem Treiber
  # ── Standby-Faces: HA-Entscheidungen neben der Uhr ──────────────────────
  # RobinPi steht in der Küche, Ableseabstand ~3 m ⇒ eine Ansicht trägt genau
  # EINEN fernlesbaren Wert. Kurze Rotation, sonst wird das Display Tapete.
  # HA liefert unter beatbird/hints/<id>: Lüften (Dauerzustand) und
  # Waschmaschine (Ereignis mit Timeout).
  faces:
    enabled: true
    topic: beatbird/hints
    max_faces: 4
    dwell_s: 8

wifi:
  ssid: "your-ssid"
  country: DE
  # Measured on the device 10.09.2026: wlan0 with a Raspberry Pi MAC and NO USB
  # wireless adapter present. RobinPi runs on the ONBOARD radio.
  # ⚠️ These two said true/false the other way round from the start, which made
  # this profile describe hardware that is not there. Harmless at runtime — the
  # values are only read by install/20-wifi.sh — but a reinstall would have
  # disabled the only radio this speaker has and taken it off the network for
  # good. A profile that lies about the hardware is a trap that springs later.
  use_usb_dongle: false
  disable_onboard_radio: false
  disable_bluetooth: true

mqtt:
  enabled: true
  host: 192.168.1.10
  port: 1883
  user: beatbird
  discovery_prefix: homeassistant
  base_topic: beatbird/robinpi

sources:
  spotify:
    enabled: true
    device_name: "RobinPi"
    bitrate: 320
    normalisation: true
  bluetooth: {enabled: false, a2dp: true}
  toslink:   {enabled: false}
  snapcast:
    # See beat-1.yml for the bridge's source-indicator behaviour. Real
    # server IP comes from BEATBIRD_SNAPCAST_SERVER (secrets/snapcast.host).
    enabled: true
    server: 192.168.1.10
    latency_ms: 30

# Weather — coords live in secrets/location.coords (gitignored).
# ⚠️ This block was missing since the profile was written, and the default is
# `enabled: false`, so RobinPi never showed weather at all — the coordinates
# and BEATBIRD_WEATHER_LAT/LON were in place the whole time, only the opt-in
# was absent. Worth knowing when a speaker "lost" something it never had.
weather:
  enabled: true
  interval_minutes: 30

web:
  enabled: true
  port: 8080
