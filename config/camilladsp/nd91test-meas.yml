---
# ND91-Testbox — MESSCONFIG: Wege einzeln erreichbar, Weiche bleibt drin.
#
# Über die Web-UI umschalten (DSP-Switcher), kein Service-Restart.
#   REW spielt nur L     → nur Woofer (mit Tiefpass)
#   REW spielt nur R     → nur HT (mit Hochpass)
#   REW spielt L+R mono  → Gesamtsystem inkl. akustischer Übernahme
# Damit reicht EINE Config für Einzelwege, Summe und Timing-Referenz
# (Referenzton auf R = HT, Sweep auf L = Woofer).
#
# Unterschied zur Produktion: kein mono_sum, sondern 1:1-Routing mit 0 dB.
# Ein Mono-Signal auf einem Kanal kommt damit mit demselben Pegel an wie
# Mono-Material in der Produktion (dort −6 + −6 dB).
# ⚠️ xover_hp und tweeter_limiter bleiben — der HT sieht nie Vollbereich.
devices:
  samplerate: 48000
  chunksize: 1024
  capture_samplerate: 44100
  resampler:
    type: Synchronous
  capture:
    type: Alsa
    channels: 2
    device: "hw:Loopback,1"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "hw:LouderRaspberry,0"
    format: S32_LE
mixers:
  split:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - {channel: 0, gain: 0}
      - dest: 1
        sources:
          - {channel: 1, gain: 0}
filters:
  sub_protect:
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 55, order: 4}
  xover_lp:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyLowpass, freq: 2500, order: 4}
  xover_hp:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyHighpass, freq: 2500, order: 4}
  tweeter_trim:
    type: Gain
    parameters:
      gain: -6.0
      inverted: false
  tweeter_delay:
    type: Delay
    parameters: {delay: 0.0, unit: ms, subsample: false}
  woofer_limiter:
    type: Limiter
    parameters:
      clip_limit: -1.0
      soft_clip: true
  tweeter_limiter:
    type: Limiter
    parameters:
      clip_limit: -10.0
      soft_clip: true
pipeline:
  - type: Mixer
    name: split
  - type: Filter
    channels: [0]
    names: [sub_protect, xover_lp, woofer_limiter]
  - type: Filter
    channels: [1]
    names: [xover_hp, tweeter_trim, tweeter_delay, tweeter_limiter]
