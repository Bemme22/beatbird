---
# ND91-Testbox — ROHMESSUNG: Woofer ohne Tiefpass, für Breakup/Weichenentwurf.
#
#   REW spielt nur L → Woofer breitbandig (nur Subsonic), zeigt den
#                      Alu-Breakup und wie weit der ND91 oben sauber läuft
#   REW spielt nur R → HT wie in -meas
#
# ⚠️ Es gibt bewusst KEINE Variante mit ungefiltertem HT: unter 2,5 kHz ist
# der Magnetostat nicht vermessen, und bei 4,2 Ω fließt schon ab 10 Hz voller
# Strom. "Roh" gilt nur für den Woofer.
# ⚠️ L und R hier NICHT gleichzeitig spielen — ohne Tiefpass überlappen die
# Wege, die Summe ist bedeutungslos.
devices:
  samplerate: 48000
  chunksize: 1024
  capture_samplerate: 44100
  resampler:
    type: Synchronous
  capture:
    type: Alsa
    channels: 2
    device: "hw:Loopback,1"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "hw:LouderRaspberry,0"
    format: S32_LE
mixers:
  split:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - {channel: 0, gain: 0}
      - dest: 1
        sources:
          - {channel: 1, gain: 0}
filters:
  sub_protect:
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 55, order: 4}
  xover_hp:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyHighpass, freq: 2500, order: 4}
  tweeter_trim:
    type: Gain
    parameters:
      gain: -6.0
      inverted: false
  # HT-Anhebung unter 4,5 kHz (gemessen 28.09.2026, 1 m, 3-ms-Fenster): der
  # Magnetostat liegt 2,5-4 kHz ~8-10 dB unter seinem 5-10-kHz-Plateau, Watte in
  # der Kapsel aendert daran nichts (+-1-2 dB). Rechnerisch optimal waeren +8 dB,
  # bewusst +6: Belastbarkeit unbekannt. Im Web-EQ (/eq) drehbar.
  ht_fill:
    type: Biquad
    parameters: {type: Peaking, freq: 3300, gain: 6.0, q: 1.5}
  woofer_limiter:
    type: Limiter
    parameters:
      clip_limit: -1.0
      soft_clip: true
  tweeter_limiter:
    type: Limiter
    parameters:
      clip_limit: -10.0
      soft_clip: true
pipeline:
  - type: Mixer
    name: split
  - type: Filter
    channels: [0]
    names: [sub_protect, woofer_limiter]
  - type: Filter
    channels: [1]
    names: [xover_hp, ht_fill, tweeter_trim, tweeter_limiter]
