---
# CamillaDSP — RobinPi — VOICING v4, für den PR MIT +10 g ZUSATZMASSE.
#
# ⚠️⚠️ NICHT AKTIVIEREN, solange der PR unbemasst ist. Diese Config setzt
# `deep_bass` auf 40 Hz und den Subsonic auf 34 Hz — beides liegt bei der
# heutigen Abstimmung (f_b = 44,53 Hz) UNTERHALB der Abstimmfrequenz. Dort
# entkoppelt der PR, der Treiberhub steigt steil, und der Boost erzeugt Hub
# statt Pegel. Erst Masse, dann diese Config.
#
# Umschalten geht in der Web-UI (DSP-Config-Auswahl) oder per
#   POST /api/dsp-config  {"name": "robinpi-fb40"}
# Zurück auf `robinpi` = Produktionsconfig. Beides ohne Neustart.
#
# ── WARUM ÜBERHAUPT TIEFER ABSTIMMEN ───────────────────────────────────────
# Vas 24,75 L stecken in 11,6 L netto. Das Gehäuse ist für diesen Treiber
# deutlich zu klein ⇒ oberhalb f_b hat er Hub im Überfluss, und die Arbeit
# unten macht ohnehin der PR. Zusatzmasse schiebt dessen Resonanz nach unten,
# OHNE den Pegel darüber nennenswert zu kosten. Gerechnet (Klumpenmodell,
# gegen die Datenblattempfindlichkeit auf 1,3 dB validiert):
#
#   f_b      Zusatzmasse   Pegel 35 Hz   Hubgrenze 35 Hz   Kosten 50–80 Hz
#   44,5 Hz  —             −16,8 dB      83,5 dB           —
#   42 Hz    +5,2 g        −14,9         86,3              −0,2 dB
#   40 Hz    +10,0 g       −13,4         89,0              −0,4 dB   ← diese
#   38 Hz    +15,5 g       −12,1         92,0              −0,5 dB
#
# Die übliche Warnung „tiefer abstimmen kostet Maximalpegel" gilt für Gehäuse,
# die am Volumen schon passen. Hier nicht.
#
# ── DIE NEUE ABSTIMMUNG ────────────────────────────────────────────────────
# f_b ∝ 1/√Mmp mit dem GEMESSENEN Mmp0 = 41,6 g (M0, 05.09.2026, inkl. der
# Luftlast des 25-mm-Downfire-Spalts):
#   +10,0 g  ⇒  f_b = 44,53 · √(41,6/51,6) = 39,98 Hz
# ⭐ Die Unsicherheit von Mmp0 (±4,5 g) schlägt kaum durch, weil beim Nachlegen
#    das VERHÄLTNIS zählt, nicht der Absolutwert: f_b = 40,0 ± 0,5 Hz.
#    (Mmp0 37,1 g ⇒ 39,5 Hz · Mmp0 46,1 g ⇒ 40,4 Hz.)
# ⭐ Volumenverlust durch 10 g Stahl: 1,3 cm³ von 11 600 — vernachlässigbar.
# ⚠️ Die PR-Güte steigt mit der Masse von 3,66 auf ~4,08 (Rap bleibt) — im
#    Modell berücksichtigt, die Resonanz wird also etwas ausgeprägter.
#
# ── WAS SICH GEGENÜBER robinpi.yml (v3) ÄNDERT ─────────────────────────────
#   sub_protect   38 → 34 Hz      (gleiche Logik: ~6 Hz unter f_b)
#   deep_bass     44 → 40 Hz, Q 1,8 → 1,6   (sitzt wieder auf der Abstimmung)
# Alles andere identisch. Erwartung am Hörplatz gegenüber v3:
#   35 Hz +6,9 dB · 38 Hz +5,4 · 40 Hz +4,1 · 45 Hz +1,0
#   Kosten: 50 Hz −0,4 · 60 Hz −0,7 · 80 Hz −0,4 · 100 Hz −0,2
# Absolut erwartet (rel. Mittelton): 35 Hz −4,4 · 40 Hz +3,5 · 50 Hz +7,5 ·
#   60 Hz +3,5 · 80 Hz +4,3 · 100 Hz +0,6
# Hub im Worst Case (0-dBFS-Sinus, voller Regler): x_d 4,4 mm (mech. Grenze
#   7,0) bei 32 Hz, PR 5,7 mm von 8,0.
#
# ❌ GEPRÜFT UND VERWORFEN: ein Schnitt auf die 50-Hz-Raummode (der Speaker
#    steht in der Ecke, die Mode ist real und bleibt). −3 dB @52 Hz, Q 2,0
#    holt die Spannweite 40–80 Hz nur von 7,5 auf 6,9 dB, zieht dafür aber die
#    ohnehin vorhandene Senke bei 45 Hz auf −2,3 dB und kostet 1,4 dB genau
#    bei 40 Hz — der Frequenz, um die es hier geht. Ein Modenschnitt müsste
#    schmaler sein, als ein Biquad bei dieser Nachbarschaft sein kann.
#
# ⚠️ NACH DEM BEMASSEN: f_b per M0-Delta-Masse nachmessen und `deep_bass.freq`
#    auf den GEMESSENEN Wert setzen, nicht auf die gerechneten 40.
devices:
  samplerate: 48000
  chunksize: 1024
  capture_samplerate: 44100
  resampler:
    type: Synchronous
  capture:
    type: Alsa
    channels: 2
    device: "hw:Loopback,1"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "hw:LouderRaspberry,0"
    format: S32_LE

filters:
  loudness:
    type: Loudness
    parameters:
      fader: Main
      reference_level: -18.0
      low_boost: 8.0
      high_boost: 0.0
      attenuate_mid: false

  headroom:
    type: Gain
    parameters: {gain: -4.0, inverted: false}

  # ~6 Hz unter der neuen Abstimmung — dieselbe Regel wie bei v3 (38 bei 44,5).
  sub_protect:
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 34, order: 4}

  # Sitzt auf der NEUEN Abstimmfrequenz: dort trägt der PR und der Treiberhub
  # ist im Minimum. Q etwas breiter als v3, weil die Flanke des tieferen
  # Hochpasses weiter weg liegt.
  deep_bass:
    type: Biquad
    parameters: {type: Peaking, freq: 40, gain: 5.5, q: 1.6}

  bass_voicing:
    type: Biquad
    parameters: {type: Lowshelf, freq: 110, gain: 3.0, q: 0.7}

  room_130:
    type: Biquad
    parameters: {type: Peaking, freq: 130, gain: 3.5, q: 1.2}

  baffle_step:
    type: Biquad
    parameters: {type: Highshelf, freq: 480, gain: 0, q: 0.7}

  presence:
    type: Biquad
    parameters: {type: Peaking, freq: 4000, gain: 0, q: 0.7}

  fullrange_limiter:
    type: Limiter
    parameters: {clip_limit: -1.0, soft_clip: true}

pipeline:
  - type: Filter
    channels: [0, 1]
    names: [loudness, headroom, sub_protect, deep_bass,
            bass_voicing, room_130, baffle_step, presence,
            fullrange_limiter]
