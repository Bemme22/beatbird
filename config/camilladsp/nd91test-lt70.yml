---
# ND91-Testbox — GESCHLOSSEN (Blindplatte), Linkwitz-Transformation auf 70 Hz.
#
# Hörvariante zum Vergleichen, per Web-UI-DSP-Switcher umschaltbar:
#   lt70 = dezent · lt55 = kräftig · lt45 = Anschlag
# Was gefällt, wandert danach in die Produktionsconfig (Varianten sind für
# Experimente, nicht für Dauerbetrieb).
#
# LT hebt die geschlossene Abstimmung Fc 96 Hz / Qtc 0,66 (GEMESSEN
# 28.09.2026 per Impedanz im Gehäuse, ungedämmt, unversiegelt) auf
# 70 Hz / Q 0,707 an. Tiefbass-Anhebung asymptotisch +5,5 dB.
# ⚠️ Bis 28.09. stand hier die Rechnung 104 Hz / 0,52 — damit spielte die
#    Box 50–150 Hz breit ~+2,5…2,8 dB lauter als geplant. Nach dem Dämmen
#    neu messen: Dämmwolle senkt Fc und Qtc, dann wieder nachführen.
# ⚠️ Grenze ist der Hub (Vd 14 cm³): klackert oder flattert es bei Bass,
#    ist Xmax erreicht — leiser, nicht mehr EQ.
# Zusätzlicher BW2-Hochpass bei 50 Hz: zusammen mit der LT (12 dB/Okt)
# 24 dB/Okt unter dem Ziel, damit Subbass keinen nutzlosen Hub kostet.
devices:
  samplerate: 48000
  chunksize: 1024
  capture_samplerate: 44100
  resampler:
    type: Synchronous
  capture:
    type: Alsa
    channels: 2
    device: "hw:Loopback,1"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "hw:LouderRaspberry,0"
    format: S32_LE
mixers:
  mono_sum:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - {channel: 0, gain: -6}
          - {channel: 1, gain: -6}
      - dest: 1
        sources:
          - {channel: 0, gain: -6}
          - {channel: 1, gain: -6}
filters:
  linkwitz:
    type: Biquad
    parameters: {type: LinkwitzTransform, freq_act: 96, q_act: 0.66, freq_target: 70, q_target: 0.707}
  sub_protect:
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 50, order: 2}
  xover_lp:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyLowpass, freq: 2500, order: 4}
  xover_hp:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyHighpass, freq: 2500, order: 4}
  tweeter_trim:
    type: Gain
    parameters:
      gain: -6.0
      inverted: false
  tweeter_delay:
    type: Delay
    parameters: {delay: 0.0, unit: ms, subsample: false}
  # Dieselben Voicing-Regler wie in der Produktion, alle 0 dB — im Web-EQ
  # (/eq) drehbar. bass_fb heißt hier nur noch so (kein Port), der Name
  # bleibt, damit Editor-Werte zwischen den Configs vergleichbar sind.
  baffle_step:
    type: Biquad
    parameters: {type: Lowshelf, freq: 700, gain: 0.0, q: 0.5}
  bass_fb:
    type: Biquad
    parameters: {type: Peaking, freq: 70, gain: 0.0, q: 1.4}
  bass_body:
    type: Biquad
    parameters: {type: Peaking, freq: 150, gain: 0.0, q: 1.0}
  room_mode:
    type: Biquad
    parameters: {type: Peaking, freq: 100, gain: 0.0, q: 3.0}
  # HT-Anhebung unter 4,5 kHz (gemessen 28.09.2026, 1 m, 3-ms-Fenster): der
  # Magnetostat liegt 2,5-4 kHz ~8-10 dB unter seinem 5-10-kHz-Plateau, Watte in
  # der Kapsel aendert daran nichts (+-1-2 dB). Rechnerisch optimal waeren +8 dB,
  # bewusst +6: Belastbarkeit unbekannt. Im Web-EQ (/eq) drehbar.
  ht_fill:
    type: Biquad
    parameters: {type: Peaking, freq: 3300, gain: 6.0, q: 1.5}
  # Woofer 0,2 ms spaeter: Summenoptimum aus den Einzelmessungen #7/#10 (1 m).
  woofer_delay:
    type: Delay
    parameters: {delay: 0.2, unit: ms, subsample: false}
  woofer_limiter:
    type: Limiter
    parameters:
      clip_limit: -1.0
      soft_clip: true
  tweeter_limiter:
    type: Limiter
    parameters:
      clip_limit: -10.0
      soft_clip: true
pipeline:
  - type: Mixer
    name: mono_sum
  - type: Filter
    channels: [0]
    names: [sub_protect, linkwitz, baffle_step, bass_fb, bass_body, room_mode, xover_lp, woofer_delay, woofer_limiter]
  - type: Filter
    channels: [1]
    names: [xover_hp, ht_fill, tweeter_trim, tweeter_delay, tweeter_limiter]
