---
# ND91-Testbox — Produktionsconfig (Startwerte, UNGEMESSEN).
#
# Kanal 0 = Woofer (Dayton ND91-4, BR fb ~69 Hz)
# Kanal 1 = Hochtöner (Lounge-Magnetostat, Belastbarkeit unbekannt)
# Weiche LR4 @ 2,5 kHz. Alles hier ist ein Startpunkt zum Gegenmessen, kein
# Voicing: Pegel, Polarität und Delay des HT entscheidet die erste Messung.
#
# Sicherheit HT — drei Schichten, keine davon ist optional:
#   1. xover_hp steht in JEDER nd91test-Config vor dem HT (auch -meas / -raw).
#   2. tweeter_limiter deckelt den HT-Kanal bei −10 dBFS.
#   3. Schutz-C 33–47 µF bipolar in Serie am HT (Hardware, fängt DSP-Fehler).
# Fällt CamillaDSP aus, ist die Box stumm — nichts läuft am DSP vorbei.
devices:
  samplerate: 48000
  chunksize: 1024
  capture_samplerate: 44100
  resampler:
    type: Synchronous
  capture:
    type: Alsa
    channels: 2
    device: "hw:Loopback,1"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "hw:LouderRaspberry,0"
    format: S32_LE
mixers:
  # Mono: beide Wege spielen dasselbe Signal. −6 + −6 dB = Unity für
  # Mono-Material, Stereo summiert sich darunter.
  mono_sum:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - {channel: 0, gain: -6}
          - {channel: 1, gain: -6}
      - dest: 1
        sources:
          - {channel: 0, gain: -6}
          - {channel: 1, gain: -6}
filters:
  # Subsonic unter der Portabstimmung: unterhalb fb entlastet der Port den
  # Treiber nicht mehr, der Hub steigt steil. 0,8 × fb ≈ 55 Hz.
  sub_protect:
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 55, order: 4}
  xover_lp:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyLowpass, freq: 2500, order: 4}
  xover_hp:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyHighpass, freq: 2500, order: 4}
  # Startwert −6 dB: Magnetostaten sind meist lauter als ein 3,5"-Konus, und
  # zu leise ist beim ersten Ton die sichere Seite. Nach der Messung angleichen.
  tweeter_trim:
    type: Gain
    parameters:
      gain: -6.0
      inverted: false
  # Zeitversatz HT↔Woofer — bleibt 0, bis REW mit Timing-Referenz gemessen hat.
  tweeter_delay:
    type: Delay
    parameters: {delay: 0.0, unit: ms, subsample: false}
  # ── Voicing-Regler (Woofer-Kanal), alle auf 0 dB = neutral ──────────────
  # Zum Drehen nach Gehör im Web-EQ-Editor (http://<pi>:8080/eq) — der zeigt
  # jede Peaking/Shelf-Biquad dieser Config. Editor-Änderungen sind flüchtig
  # (PatchConfig); was gefällt, gehört danach HIER eingetragen.
  # Headroom: bei vollem Regler liegt das Signal durch volume.max_db −10 dB
  # rund 10 dB unter Vollaussteuerung — so viel Boost verträgt die Kette,
  # bevor woofer_limiter soft-clippt. ⚠️ Zu viel Boost klingt nicht nach
  # "mehr Bass", sondern nach "leiser" (RobinPi, 17.09.2026).
  #
  # Baffle-Step: 123 mm Front ⇒ Stufe um ~115/0,123 m ≈ 900 Hz. Darunter
  # strahlt der Woofer in den ganzen Raum und verliert bis zu 6 dB — das ist
  # das "dünn" kleiner Boxen. Typisch +2…+4 dB, abhängig vom Wandabstand
  # (wandnah braucht weniger).
  baffle_step:
    type: Biquad
    parameters: {type: Lowshelf, freq: 700, gain: 0.0, q: 0.5}
  # Auf der Portabstimmung: dort trägt der Port, der Treiberhub ist im
  # Minimum, Pegel am billigsten. NICHT tiefer schieben — unter fb steigt der
  # Hub steil, und sub_protect (55 Hz) schneidet dort ohnehin.
  bass_fb:
    type: Biquad
    parameters: {type: Peaking, freq: 70, gain: 0.0, q: 1.4}
  # Grundton/Wärme — Cello, Männerstimmen, Kickdrum-Körper.
  bass_body:
    type: Biquad
    parameters: {type: Peaking, freq: 150, gain: 0.0, q: 1.0}
  # Reserve gegen eine Raummode (dröhnt ein Ton? Frequenz suchen, absenken).
  room_mode:
    type: Biquad
    parameters: {type: Peaking, freq: 100, gain: 0.0, q: 3.0}
  woofer_limiter:
    type: Limiter
    parameters:
      clip_limit: -1.0
      soft_clip: true
  tweeter_limiter:
    type: Limiter
    parameters:
      clip_limit: -10.0
      soft_clip: true
pipeline:
  - type: Mixer
    name: mono_sum
  - type: Filter
    channels: [0]
    names: [sub_protect, baffle_step, bass_fb, bass_body, room_mode, xover_lp, woofer_limiter]
  - type: Filter
    channels: [1]
    names: [xover_hp, tweeter_trim, tweeter_delay, tweeter_limiter]
