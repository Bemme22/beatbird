---
# CamillaDSP — RobinPi (Rotkehlchen) — VOICING v4, 17.09.2026.
# Single fullrange Mark Audio Pluvia 11, PR-loaded (Dayton DS175-PR), MONO.
#
# ⚠️⚠️ DIESE CONFIG GILT FUER DEN PR MIT +10 g ZUSATZMASSE (verbaut 17.09.2026).
#    Gemessenes f_b vor der Bemassung: 44,53 Hz. Danach gerechnet: 40,0 ± 0,5 Hz.
#    Wird die Masse je wieder abgenommen, sitzen `deep_bass` (40 Hz) und
#    `sub_protect` (34 Hz) UNTER der Abstimmung — dort entkoppelt der PR und
#    der Boost erzeugt Hub statt Pegel. Dann zurueck auf die 44-Hz-Werte
#    (git log dieser Datei, Stand "Voicing v3.1").
#
# ── WEG HIERHER (drei Schritte an einem Tag) ───────────────────────────────
# v3  : Tiefbass von 70 Hz (Oberbass) auf 44 Hz (Abstimmfrequenz) verlegt und
#       die Pegelbilanz repariert (max_db -10 -> -2; der Amp lief laengst auf
#       Unity, die Reserve lag allein im Fader).
# v3.1: Hoerurteil "tiefe Streicher kommen nicht". Gegengerechnet war das
#       keine Geschmacksfrage: an den Leersaiten lagen 13 dB zwischen
#       A1 (55 Hz, +7,4) und D3 (147 Hz, -6,0) — DESSELBEN Cellos. Eine
#       Basslinie ueber die Saiten wird so zur Lautstaerketreppe: die
#       boomigen Toene tragen, die melodiefuehrenden verschwinden.
#       ⭐ Die Antwort war NICHT mehr Bass, sondern weniger Spreizung:
#         * `bass_voicing` (Lowshelf 110 Hz +3 dB) auf 0 — ein Shelf hebt
#           ALLES darunter und war der Hauptgrund fuer das Droehnen 55-75 Hz.
#         * `deep_bass` SCHMALER statt schwaecher (q 1,6 -> 2,3, +5,5 -> +6,5):
#           der Zug bleibt auf 38-45 Hz und laeuft nicht mehr nach oben aus.
#           Das erhaelt das "tolle Gefuehl" (41 Hz verliert 0,4 dB).
#         * `room_130` breiter (q 1,2 -> 0,9, +3,5 -> +5,0) plus neuer
#           `cello_body` bei 100 Hz — zusammen decken sie 90-200 Hz ab.
#       Ergebnis an den Saiten: G2 -0,3 -> +2,3 · A2 +0,8 -> +3,5 ·
#       D3 -6,0 -> -3,5 · A3 -0,5 -> +1,7 dB. Spreizung 12,7 -> 9,0 dB.
#       ⭐ Nebengewinn: die Kette wurde BILLIGER (+7,8 -> +6,6 dB Spitze),
#       deshalb headroom -4 -> -3 dB ⇒ 1 dB mehr Pegel, und der Treiberhub
#       sank trotzdem (4,40 -> 3,49 mm im Worst Case).
# v4  : PR mit +10 g bemasst, f_b 44,5 -> 40 Hz. In einem zu KLEINEN Gehaeuse
#       (Vas 24,75 L in 11,6 L netto) ist das fast gratis: der Treiber hat
#       oberhalb f_b Hub im Ueberfluss, die Arbeit unten macht ohnehin der PR.
#       +6,9 dB bei 35 Hz, +4,1 dB bei 40 Hz, Kosten 50-100 Hz: 0,2-0,7 dB.
#
# ⚠️ Was NICHT geht: 147 Hz bleiben bei -3,5 dB. Dort sitzt eine Ausloeschung
#    (roh -10,1 dB im Raummittel), und die ist nicht entzerrbar.
# ❌ Geprueft und verworfen: Schnitt auf die 50-Hz-Raummode (der Speaker steht
#    in der Ecke, die Mode ist real). -3 dB @52 Hz Q2,0 holt die Spannweite
#    40-80 Hz nur von 7,5 auf 6,9 dB, vertieft die Senke bei 45 Hz und kostet
#    1,4 dB genau bei 40 Hz. Merksatz: liegen Mode und Senke eine Terz
#    auseinander, ist ein Biquad zu breit fuer beide.
#
# ── ARCHITEKTUR (seit 15.09.2026) ──────────────────────────────────────────
# Die Bridge regelt NUR NOCH DIE LAUTSTAERKE. Alles Klangliche steht hier:
#   dauerhafte Entzerrung    -> statische Biquads
#   pegelabhaengige Anhebung -> nativer Loudness-Filter am Main-Fader
# ⚠️ Setzt audio.loudness.enabled: false in profiles/robinpi.yml voraus.
#
# Amp: Louder Hat Plus 1X (TAS5825M @ 0x4c) in PBTL. Das Overlay setzt
# bridge_mode=1 + mixer_mode=1, der CHIP summiert L+R zu Mono. Deshalb steht
# hier KEIN Mono-Mixer (der wuerde doppelt summieren) — beide Kanaele werden
# identisch entzerrt, der Amp faltet sie zusammen.
#
# ── Messgrundlage ──────────────────────────────────────────────────────────
#   Nahfeld    : f_b = 44,53 Hz (Sweep 06.09.) / 44,61 Hz (RTA 05.09.) — 0,2 %
#   Anechoisch : 1 m on-axis, Gate 1,9 ms -> 526 Hz-3 kHz flach ±1 dB
#   Hoerplatz  : Kueche (Eckaufstellung), 4 Positionen energetisch gemittelt
#   Hubmodell  : Klumpenmodell aus T/S + gemessener PR-Masse, gegen die
#                Datenblattempfindlichkeit auf 1,3 dB validiert
devices:
  samplerate: 48000
  chunksize: 1024
  capture_samplerate: 44100
  resampler:
    type: Synchronous
  capture:
    type: Alsa
    channels: 2
    device: "hw:Loopback,1"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "hw:LouderRaspberry,0"
    format: S32_LE

filters:
  loudness:
    type: Loudness
    parameters:
      fader: Main
      reference_level: -18.0
      low_boost: 8.0
      high_boost: 0.0
      attenuate_mid: false

  headroom:
    type: Gain
    parameters: {gain: -3.0, inverted: false}

  # ~6 Hz unter der neuen Abstimmung — dieselbe Regel wie bei v3 (38 bei 44,5).
  sub_protect:
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 34, order: 4}

  # Sitzt auf der NEUEN Abstimmfrequenz: dort trägt der PR und der Treiberhub
  # ist im Minimum. Q etwas breiter als v3, weil die Flanke des tieferen
  # Hochpasses weiter weg liegt.
  deep_bass:
    type: Biquad
    parameters: {type: Peaking, freq: 40, gain: 6.5, q: 2.3}

  # Auf 0 seit v3.1: ein Lowshelf hebt ALLES unterhalb seiner Eckfrequenz, also
  # auch die 55–75 Hz, die ohnehin von der Raummode und der Flanke des
  # deep_bass getragen werden — er war die Ursache des Droehnens, das die
  # tiefen Streicher zugedeckt hat. Bleibt als Regler stehen (Hausbrauch wie
  # baffle_step und presence), damit die Schraube da ist, wenn sie fehlt.
  bass_voicing:
    type: Biquad
    parameters: {type: Lowshelf, freq: 110, gain: 0, q: 0.7}

  cello_body:
    type: Biquad
    parameters: {type: Peaking, freq: 100, gain: 2.0, q: 1.6}

  room_130:
    type: Biquad
    parameters: {type: Peaking, freq: 130, gain: 5.0, q: 0.9}

  baffle_step:
    type: Biquad
    parameters: {type: Highshelf, freq: 480, gain: 0, q: 0.7}

  presence:
    type: Biquad
    parameters: {type: Peaking, freq: 4000, gain: 0, q: 0.7}

  fullrange_limiter:
    type: Limiter
    parameters: {clip_limit: -1.0, soft_clip: true}

pipeline:
  - type: Filter
    channels: [0, 1]
    names: [loudness, headroom, sub_protect, deep_bass,
            bass_voicing, cello_body, room_130, baffle_step, presence,
            fullrange_limiter]
