# /etc/systemd/system.conf.d/beatbird-hw-watchdog.conf — installed by
# install/20-wifi.sh.
#
# Arm the SoC hardware watchdog (bcm2835-wdt, /dev/watchdog). systemd pets it;
# if the kernel or PID 1 hangs, the SoC resets itself. 15 s is the bcm2835
# maximum. The WiFi watchdog's reboot stage only helps while userspace still
# runs — this covers the case where nothing runs anymore.
# Found 2026-09-23: RuntimeWatchdogUSec=0 on every speaker (Beat: 3 days dark).
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
